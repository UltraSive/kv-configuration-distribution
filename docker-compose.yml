# A three-tier tree: root (writes) -> replica (full copy) -> proxy (cache).
services:
  root:
    build: .
    environment:
      KV_ROLE: root
    ports: ["8080:8080"]
    volumes: [root-data:/data]

  replica:
    build: .
    environment:
      KV_ROLE: replica
      KV_UPSTREAMS: root:7070
    ports: ["8081:8080"]
    volumes: [replica-data:/data]
    depends_on: [root]

  proxy:
    build: .
    environment:
      KV_ROLE: proxy
      KV_UPSTREAMS: replica:7070,root:7070
      KV_REPLICAS: replica:7070
    ports: ["8082:8080"]
    volumes: [proxy-data:/data]
    depends_on: [replica]

volumes:
  root-data:
  replica-data:
  proxy-data:
